spring:
  application:
    name: smartdesk-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smartdesk
    username: smartdesk
    password: smartdesk123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true

  # IMPORTANT: Use NONE for session - we use JWT not sessions
  session:
    store-type: none

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1000ms
      connect-timeout: 1000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

app:
  jwt:
    secret: smartdesk-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    expiration: 86400000
  ai-service:
    url: http://localhost:8000
  upload:
    dir: ./uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.smartdesk: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: INFO